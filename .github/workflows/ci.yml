name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test backend/StoryCoffee.sln -m:1 /nr:false

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend exec tsc --noEmit
      - run: pnpm --filter frontend test
      - run: pnpm --filter frontend build

  api-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: storycoffee_contract
          POSTGRES_USER: storycoffee
          POSTGRES_PASSWORD: storycoffee_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storycoffee -d storycoffee_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate and verify OpenAPI client
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          ASPNETCORE_URLS: http://localhost:5080
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=storycoffee_contract;Username=storycoffee;Password=storycoffee_password
          SeedData__Enabled: "false"
          Redis__Enabled: "false"
          DocumentStorage__Provider: Local
          DocumentStorage__LocalRoot: .storycoffee-files-contract
          Email__Provider: Stub
          Outbox__Enabled: "false"
          Quartz__Enabled: "false"
        run: |
          dotnet run --project backend/src/StoryCoffee.Api --no-launch-profile > /tmp/storycoffee-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; cat /tmp/storycoffee-api.log' EXIT
          for _ in {1..60}; do
            if curl -fsS http://localhost:5080/swagger/v1/swagger.json >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:5080/swagger/v1/swagger.json >/dev/null
          pnpm check:api

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm template storycoffee infra/helm/storycoffee

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: storycoffee
      POSTGRES_USER: storycoffee
      POSTGRES_PASSWORD: storycoffee_password
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storycoffee -d storycoffee"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ap-southeast-2
      DEBUG: "0"
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  mailhog:
    image: mailhog/mailhog:v1.0.1
    user: "0:0"
    environment:
      MH_STORAGE: maildir
      MH_MAILDIR_PATH: /maildir
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailhog_data:/maildir

  api:
    build:
      context: ..
      dockerfile: backend/src/StoryCoffee.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=storycoffee;Username=storycoffee;Password=storycoffee_password
      Jwt__Secret: dev-only-change-me-storycoffee-phase-one-secret
      Jwt__Issuer: StoryCoffee
      Jwt__Audience: StoryCoffee.App
      Jwt__ExpiryMinutes: 480
      Cors__AllowedOrigins__0: http://localhost:8080
      Cors__AllowedOrigins__1: http://localhost:5173
      SeedData__Enabled: true
      Redis__Enabled: true
      Redis__ConnectionString: redis:6379
      DocumentStorage__Provider: S3
      DocumentStorage__BucketName: storycoffee-documents
      DocumentStorage__S3Region: ap-southeast-2
      DocumentStorage__ServiceUrl: http://localstack:4566
      DocumentStorage__AccessKey: test
      DocumentStorage__SecretKey: test
      DocumentStorage__ForcePathStyle: true
      Email__Provider: Smtp
      Email__FromName: StoryCoffee
      Email__FromAddress: no-reply@storycoffee.co.nz
      Email__SmtpHost: mailhog
      Email__SmtpPort: 1025
      Email__UseStartTls: false
      Email__WebhookSecret: ""
      Email__VerifySnsSignature: false
      Email__AutoConfirmSnsSubscriptions: false
      Outbox__Enabled: true
      Outbox__LockTimeoutSeconds: 300
    ports:
      - "5080:8080"
    volumes:
      - document_storage:/var/storycoffee-files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  localstack_data:
  document_storage:
  mailhog_data:

services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: storycoffee_test
      POSTGRES_USER: storycoffee
      POSTGRES_PASSWORD: storycoffee_password
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storycoffee -d storycoffee_test"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis-test:
    image: redis:7
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  localstack-test:
    image: localstack/localstack:3
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ap-southeast-2
    ports:
      - "54566:4566"

  mailhog-test:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "11025:1025"
      - "18025:8025"

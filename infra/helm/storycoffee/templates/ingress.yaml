{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storycoffee
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: storycoffee-api
                port:
                  number: {{ .Values.api.port }}
          - path: /health
            pathType: Exact
            backend:
              service:
                name: storycoffee-api
                port:
                  number: {{ .Values.api.port }}
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: storycoffee-api
                port:
                  number: {{ .Values.api.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storycoffee-frontend
                port:
                  number: 80
{{- end }}

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storycoffee-postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storycoffee-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storycoffee-postgres
  template:
    metadata:
      labels:
        app: storycoffee-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: storycoffee-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.username }}", "-d", "{{ .Values.postgres.database }}"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: storycoffee-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: storycoffee-postgres
spec:
  selector:
    app: storycoffee-postgres
  ports:
    - port: 5432
      targetPort: 5432

apiVersion: apps/v1
kind: Deployment
metadata:
  name: storycoffee-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: storycoffee-api
  template:
    metadata:
      labels:
        app: storycoffee-api
    spec:
      containers:
        - name: api
          image: {{ .Values.api.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: storycoffee-config
            - secretRef:
                name: {{ include "storycoffee.secretName" . }}
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.api.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: storycoffee-api
spec:
  selector:
    app: storycoffee-api
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: storycoffee-api
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}

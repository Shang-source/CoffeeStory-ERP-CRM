{{- if .Values.localstack.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storycoffee-localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storycoffee-localstack
  template:
    metadata:
      labels:
        app: storycoffee-localstack
    spec:
      containers:
        - name: localstack
          image: {{ .Values.localstack.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.localstack.port }}
          env:
            - name: SERVICES
              value: s3
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.api.documentStorageS3Region | quote }}
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: {{ .Values.localstack.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: storycoffee-localstack
spec:
  selector:
    app: storycoffee-localstack
  ports:
    - port: {{ .Values.localstack.port }}
      targetPort: {{ .Values.localstack.port }}
{{- end }}
